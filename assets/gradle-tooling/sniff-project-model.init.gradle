import org.gradle.api.Plugin
import org.gradle.api.Project
import org.gradle.api.plugins.JavaPluginExtension
import org.gradle.api.publish.PublishingExtension
import org.gradle.api.tasks.SourceSet
import org.gradle.tooling.provider.model.ToolingModelBuilder
import org.gradle.tooling.provider.model.ToolingModelBuilderRegistry

import javax.inject.Inject
import java.nio.file.Files

class SniffGradleProducerTaskData implements Serializable {
    String taskPath
    String taskType
    List<String> outputFiles
    List<String> productionSourceFiles
}

class SniffGradleProjectModelData implements Serializable {
    String projectPath
    String projectName
    String groupName
    String projectVersion
    String projectDirectory
    String buildFile
    boolean buildFileExists
    List<String> providerKinds
    List<String> productionSourceFiles
    List<SniffGradleProducerTaskData> producerTasks
}

class SniffGradleBuildModelData implements Serializable {
    String contract
    String gradleVersion
    String settingsDirectory
    List<SniffGradleProjectModelData> projects
}

class SniffGradleModelBuilder implements ToolingModelBuilder {
    private static final String MODEL_NAME = "SniffGradleBuildModel"

    @Override
    boolean canBuild(String modelName) {
        modelName == MODEL_NAME
    }

    @Override
    Object buildAll(String modelName, Project requestedProject) {
        Project root = requestedProject.rootProject
        List<Project> gradleProjects = root.allprojects
            .toList()
            .sort { left, right -> left.path <=> right.path }
        List<SniffGradleProjectModelData> projects = gradleProjects.collect { project -> projectModel(project) }
        attachProducerTasks(gradleProjects, projects)
        new SniffGradleBuildModelData(
            contract: "sniff-gradle-tooling-project-model-v4",
            gradleVersion: root.gradle.gradleVersion,
            settingsDirectory: root.gradle.startParameter.currentDir.canonicalPath,
            projects: projects,
        )
    }

    private static SniffGradleProjectModelData projectModel(Project project) {
        Set<String> kinds = new TreeSet<>()
        if (project.pluginManager.hasPlugin("application")) {
            kinds.add("application")
        }
        if (project.pluginManager.hasPlugin("java-library")) {
            kinds.add("java_library")
        }
        if (project.pluginManager.hasPlugin("java-gradle-plugin")) {
            kinds.add("gradle_plugin")
        }
        PublishingExtension publishing = project.extensions.findByType(PublishingExtension)
        if (publishing != null && !publishing.publications.empty) {
            kinds.add("publication")
        }
        if (kinds.empty) {
            kinds.add("unclassified")
        }

        Set<String> sourceFiles = new TreeSet<>()
        JavaPluginExtension java = project.extensions.findByType(JavaPluginExtension)
        SourceSet main = java?.sourceSets?.findByName(SourceSet.MAIN_SOURCE_SET_NAME)
        main?.allSource?.files?.each { file ->
            String name = file.name.toLowerCase(Locale.ROOT)
            if (file.isFile() && (name.endsWith(".java") || name.endsWith(".kt"))) {
                sourceFiles.add(file.canonicalPath)
            }
        }

        new SniffGradleProjectModelData(
            projectPath: project.path,
            projectName: project.name,
            groupName: project.group?.toString() ?: "",
            projectVersion: project.version?.toString() ?: "",
            projectDirectory: project.projectDir.canonicalPath,
            buildFile: project.buildFile.canonicalPath,
            buildFileExists: project.buildFile.isFile(),
            providerKinds: kinds.toList(),
            productionSourceFiles: sourceFiles.toList(),
            producerTasks: [],
        )
    }

    private static void attachProducerTasks(
        List<Project> gradleProjects,
        List<SniffGradleProjectModelData> models
    ) {
        gradleProjects.each { producerProject ->
            producerProject.tasks.toList().sort { left, right -> left.path <=> right.path }.each { task ->
                if (!task.enabled || !task.outputs.hasOutput) {
                    return
                }
                List<File> outputs = task.outputs.files.files
                    .collect { file -> file.absoluteFile.toPath().normalize().toFile() }
                    .sort { left, right -> left.path <=> right.path }
                models.each { model ->
                    List<File> sources = model.productionSourceFiles.collect { path -> new File(path) }
                    List<File> matchingOutputs = outputs.findAll { output ->
                        sources.any { source -> output == source || (Files.isDirectory(output.toPath()) && source.toPath().startsWith(output.toPath())) }
                    }
                    List<File> matchingSources = sources.findAll { source ->
                        matchingOutputs.any { output -> output == source || source.toPath().startsWith(output.toPath()) }
                    }
                    if (!matchingSources.empty) {
                        Set<org.gradle.api.Task> closure = new LinkedHashSet<>()
                        List<org.gradle.api.Task> pending = [task]
                        while (!pending.empty) {
                            org.gradle.api.Task current = pending.remove(0)
                            if (closure.add(current)) {
                                pending.addAll(current.taskDependencies.getDependencies(current))
                            }
                        }
                        List<File> replayOutputs = closure
                            .collectMany { dependency -> dependency.outputs.files.files as List<File> }
                            .collect { file -> file.absoluteFile.toPath().normalize().toFile() }
                            .unique { file -> file.path }
                            .sort { left, right -> left.path <=> right.path }
                        model.producerTasks.add(new SniffGradleProducerTaskData(
                            taskPath: task.path,
                            taskType: task.class.name.replaceFirst(/_Decorated$/, ""),
                            outputFiles: replayOutputs.collect { file -> file.path },
                            productionSourceFiles: matchingSources.collect { file -> file.path },
                        ))
                    }
                }
            }
        }
        models.each { model ->
            model.producerTasks.sort { left, right ->
                [left.taskPath, left.taskType, left.outputFiles, left.productionSourceFiles] <=>
                    [right.taskPath, right.taskType, right.outputFiles, right.productionSourceFiles]
            }
        }
    }
}

class SniffGradleModelPlugin implements Plugin<Project> {
    private final ToolingModelBuilderRegistry registry

    @Inject
    SniffGradleModelPlugin(ToolingModelBuilderRegistry registry) {
        this.registry = registry
    }

    @Override
    void apply(Project project) {
        if (project == project.rootProject) {
            registry.register(new SniffGradleModelBuilder())
        }
    }
}

allprojects {
    apply plugin: SniffGradleModelPlugin
}
