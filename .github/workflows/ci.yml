name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
      - name: Install Linux proof sandbox
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bubblewrap
      - name: Enable Linux user namespaces for proof sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install pinned semantic indexers for dogfood
        shell: bash
        run: |
          set -euo pipefail
          for fixture in typescript javascript python go kotlin rust; do
            cargo run --quiet -- indexers install "tests/semantic_gold_fixtures/${fixture}" --yes
          done
      - run: cargo test --all-targets --locked

  msrv:
    name: msrv-1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --all-targets --locked

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package --locked --target-dir target/package-check

  semantic-indexers:
    name: semantic-indexers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
      - name: Require the compiler runtimes used by the pinned providers
        run: |
          node --version
          python3 --version
          go version
          java --version
          gradle --version
      - name: Install and run every pinned semantic indexer
        shell: bash
        run: |
          set -euo pipefail
          fixtures=(
            typescript
            javascript
            python
            go
            kotlin
            rust
          )
          for fixture in "${fixtures[@]}"; do
            cargo run --quiet -- indexers install "tests/semantic_gold_fixtures/${fixture}" --yes
            cargo run --quiet -- indexers index "tests/semantic_gold_fixtures/${fixture}" --yes
          done

  verify:
    name: verify
    if: always()
    needs: [format, clippy, test, msrv, package, semantic-indexers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        shell: bash
        run: |
          [[ "${{ needs.format.result }}" == "success" ]]
          [[ "${{ needs.clippy.result }}" == "success" ]]
          [[ "${{ needs.test.result }}" == "success" ]]
          [[ "${{ needs.msrv.result }}" == "success" ]]
          [[ "${{ needs.package.result }}" == "success" ]]
          [[ "${{ needs.semantic-indexers.result }}" == "success" ]]
