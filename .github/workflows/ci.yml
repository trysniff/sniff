name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  blind-prior-archive-preflight:
    name: blind-prior-archive-preflight
    runs-on: ubuntu-latest
    outputs:
      dogfood_groups: ${{ steps.dogfood_scope.outputs.groups }}
      library_proofs: ${{ steps.library_scope.outputs.proofs }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify the released source-seal archive layout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download sniffbench-blind-oss-v1-source-seal --repo trysniff/sniff \
            --pattern sniffbench-blind-oss-v1-source-seal.zip --dir "$RUNNER_TEMP"
          archive="$RUNNER_TEMP/sniffbench-blind-oss-v1-source-seal.zip"
          echo "9cfca885c88ce7f8d2c7cc01114b6bc129acd5e2dfa432ef3b255858a51b65a9  $archive" \
            | sha256sum --check
          python3 tools/ci/extract_blind_source_seal.py "$archive" "$RUNNER_TEMP/extracted"
      - name: Verify complete native test-target discovery and exit handling
        run: python3 tools/ci/test_run_native_unit_tests.py
      - name: Verify offline historical source-record inventory fails closed
        run: python3 tools/ci/test_audit_historical_source_records.py
      - name: Assign every isolated native library proof to the required matrix
        id: library_scope
        shell: bash
        run: |
          set -euo pipefail
          proofs="$(python3 tools/ci/run_native_unit_tests.py --library-proofs)"
          echo "proofs=$proofs" >> "$GITHUB_OUTPUT"
      - name: Verify exhaustive dogfood shard discovery and exit handling
        run: python3 tools/ci/test_run_native_dogfood.py
      - name: Assign every dogfood group to the native matrix
        id: dogfood_scope
        shell: bash
        run: |
          set -euo pipefail
          groups="$(python3 tools/ci/run_native_dogfood.py --groups)"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  test:
    name: test-${{ matrix.os }}-${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        suite: [library, binaries, integrations]
    runs-on: ${{ matrix.os }}
    # Each exhaustive suite owns its budget rather than consuming dogfood's.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-native-proof
      - name: Run the native suite partition
        shell: bash
        run: |
          python tools/ci/run_native_unit_tests.py --suite '${{ matrix.suite }}'

  native-library-proofs:
    name: library-proof-${{ matrix.os }}-${{ matrix.proof }}
    needs: blind-prior-archive-preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        proof: ${{ fromJSON(needs.blind-prior-archive-preflight.outputs.library_proofs) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.proof == 'go-project-model' && 360 || 90 }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-native-proof
        with:
          fixtures: ${{ matrix.proof == 'go-project-model' && 'go' || 'kotlin' }}
      - name: Verify selected Windows JVM and Gradle startup before model derivation
        if: runner.os == 'Windows' && matrix.proof == 'gradle-project-model'
        shell: bash
        run: |
          set -euo pipefail
          scope='benchmark::release::non_blind_history_runtime::gradle_windows_tests::'
          inventory="$(cargo test --lib --locked "$scope" -- --list --ignored)"
          test "$(printf '%s\n' "$inventory" | grep -c ': test$')" -eq 2
          printf '%s\n' "$inventory" | grep -Fx \
            "${scope}selected_jvm_starts_in_the_gradle_runtime_sandbox: test"
          printf '%s\n' "$inventory" | grep -Fx \
            "${scope}selected_gradle_reports_its_version_in_the_runtime_sandbox: test"
          cargo test --lib --locked "$scope" -- --ignored --test-threads=1 --nocapture
      - name: Require the exact native proof with immediate diagnostics
        shell: bash
        run: python tools/ci/run_native_unit_tests.py --library-proof '${{ matrix.proof }}'

  native-dogfood:
    name: dogfood-${{ matrix.os }}-${{ matrix.group }}
    needs: blind-prior-archive-preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        group: ${{ fromJSON(needs.blind-prior-archive-preflight.outputs.dogfood_groups) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-native-proof
      - name: Preserve the Windows dogfood compiler deadline
        if: runner.os == 'Windows'
        shell: bash
        run: echo "SNIFF_INTERNAL_INDEXER_TIMEOUT_SECS=300" >> "$GITHUB_ENV"
      - name: Run every test in the native dogfood shard
        shell: bash
        env:
          SNIFF_DEBUG_INDEXERS: "1"
        run: python tools/ci/run_native_dogfood.py '${{ matrix.group }}'

  native-compiler-proofs:
    name: compiler-${{ matrix.os }}-${{ matrix.fixture }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        fixture: [typescript, go]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-native-proof
        with:
          fixtures: ${{ matrix.fixture }}
      - name: Verify normal TypeScript compiler worlds in the native sandbox
        if: matrix.fixture == 'typescript'
        shell: bash
        run: |
          set -euo pipefail
          inventory="$(cargo test --lib --locked \
            semantic_indexer_runner::typescript_model::tests::normal_scan_ \
            -- --list --ignored)"
          test "$(printf '%s\n' "$inventory" | grep -c ': test$')" -eq 2
          printf '%s\n' "$inventory" | grep -Fx \
            'semantic_indexer_runner::typescript_model::tests::normal_scan_discovers_and_indexes_reference_world_without_git_or_model_calls: test'
          printf '%s\n' "$inventory" | grep -Fx \
            'semantic_indexer_runner::typescript_model::tests::normal_scan_preserves_implicit_jsconfig_compiler_defaults: test'
          cargo test --lib --locked \
            semantic_indexer_runner::typescript_model::tests::normal_scan_ \
            -- --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            semantic_indexer_runner::typescript_runner::input_boundary_tests::normal_scan_rejects_stale_or_removed_census_inputs_before_worker_or_progress_reuse \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            semantic_indexer_runner::execution::tests::native_typescript_completion_rejects_cleanup_source_and_publication_faults_with_actual_worker_evidence \
            -- --exact --ignored --test-threads=1 --nocapture
      - name: Verify native Windows Go stdin reaches EOF in children
        if: matrix.fixture == 'go' && runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          probe='sandbox::windows_stdin_tests::native_go_child_and_grandchild_receive_eof_input'
          inventory="$(cargo test --lib --locked "$probe" -- --exact --list --ignored)"
          test "$(printf '%s\n' "$inventory" | grep -c ': test$')" -eq 1
          printf '%s\n' "$inventory" | grep -Fx "$probe: test"
          cargo test --lib --locked "$probe" -- --exact --ignored --test-threads=1 --nocapture
      - name: Verify same-SDK Go driver generates with EOF in AppContainer
        if: matrix.fixture == 'go' && runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          probe='go_tool_stdio::tests::same_sdk_go_driver_compiles_and_generates_with_eof_in_appcontainer'
          inventory="$(cargo test --lib --locked "$probe" -- --exact --list --ignored)"
          test "$(printf '%s\n' "$inventory" | grep -c ': test$')" -eq 1
          printf '%s\n' "$inventory" | grep -Fx "$probe: test"
          cargo test --lib --locked "$probe" -- --exact --ignored --test-threads=1 --nocapture
      - name: Verify Go preparation failures at native executor boundaries
        if: matrix.fixture == 'go'
        shell: bash
        run: |
          cargo test --lib --locked \
            semantic_indexer_runner::go_model::preparation_tests:: \
            -- --ignored --test-threads=1 --nocapture
      - name: Verify normal Windows Go adapter production and verified reuse
        if: matrix.fixture == 'go' && runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          probe='go_runtime_adapter::tests::real_selected_sdk_adapter_is_produced_once_and_reused_verified'
          inventory="$(cargo test --lib --locked "$probe" -- --exact --list --ignored)"
          test "$(printf '%s\n' "$inventory" | grep -c ': test$')" -eq 1
          printf '%s\n' "$inventory" | grep -Fx "$probe: test"
          cargo test --lib --locked "$probe" -- --exact --ignored --test-threads=1 --nocapture
      - name: Verify normal Go model and generator runtime
        if: matrix.fixture == 'go'
        shell: bash
        run: |
          set -euo pipefail
          for probe in \
            benchmark::release::intentional_boundary_project_model_go::tests::real_go_list_is_sandboxed_or_fails_as_typed_unavailable \
            benchmark::release::intentional_boundary_generator::go::tests::real_go_generator_reproduces_compiler_owned_output_twice_offline
          do
            inventory="$(cargo test --lib --locked "$probe" -- --exact --list)"
            test "$(printf '%s\n' "$inventory" | grep -c ': test$')" -eq 1
            printf '%s\n' "$inventory" | grep -Fx "$probe: test"
            cargo test --lib --locked "$probe" -- --exact --test-threads=1 --nocapture
          done
      - name: Reject stale Go inputs at the native qualified executor boundary
        if: matrix.fixture == 'go'
        shell: bash
        run: |
          cargo test --lib --locked \
            semantic_indexer_runner::go_runner::input_binding_tests:: \
            -- --ignored --test-threads=1 --nocapture
      - name: Preserve real Go census validation evidence and remove owned stage
        if: matrix.fixture == 'go'
        shell: bash
        run: |
          cargo test --lib --locked \
            semantic_indexer_runner::go_model::evidence_tests::normal_discovery_validation_keeps_real_constraint_output_and_cleans_stage \
            -- --ignored --test-threads=1 --nocapture

  temporal-prior-replay:
    name: temporal-prior-replay-${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify temporal capture and proof-inventory guards
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci/test_temporal_prior_replay.py
          python tools/ci/test_prepare_temporal_prior_v2.py
      - name: Replay the pinned Scorecard publication witness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          query="$(cat src/benchmark_assets/historical-v3-scorecard-publication.graphql)"
          gh api graphql -f "query=$query" > "$RUNNER_TEMP/scorecard-live.json"
          python tools/ci/temporal_prior_replay.py compare "$RUNNER_TEMP/scorecard-live.json" \
            sniffbench/historical-v3-scorecard-publication-response.json
          frame="$RUNNER_TEMP/scorecard-projects.csv"
          curl --fail --location --silent --show-error --retry 3 --output "$frame" \
            https://raw.githubusercontent.com/ossf/scorecard/40c1e35996730d4fdcbdb2e6a23917a2467e29b7/cron/internal/data/projects.csv
          python tools/ci/temporal_prior_replay.py sha256 "$frame" \
            55b1de849d6d401bd6529a2806d587b53170cfbe7cdbc2ac5799ab65bf42807a
          SNIFF_SCORECARD_FRAME_PATH="$frame" python tools/ci/temporal_prior_replay.py test scorecard
      - name: Replay the blind prior repository identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          query="$(cat src/benchmark_assets/historical-v3-blind-prior-identities.graphql)"
          gh api graphql -f "query=$query" > "$RUNNER_TEMP/blind-identities-live.json"
          python tools/ci/temporal_prior_replay.py compare "$RUNNER_TEMP/blind-identities-live.json" \
            sniffbench/historical-v3-blind-prior-identities-response.json --data-only
          mkdir -p "$RUNNER_TEMP/blind-prior"
          gh release download sniffbench-blind-oss-v1-source-seal --repo trysniff/sniff \
            --pattern sniffbench-blind-oss-v1-source-seal.zip --dir "$RUNNER_TEMP/blind-prior"
          archive="$RUNNER_TEMP/blind-prior/sniffbench-blind-oss-v1-source-seal.zip"
          python tools/ci/temporal_prior_replay.py sha256 "$archive" \
            9cfca885c88ce7f8d2c7cc01114b6bc129acd5e2dfa432ef3b255858a51b65a9
          mkdir -p "$RUNNER_TEMP/blind-prior/extracted"
          python tools/ci/extract_blind_source_seal.py \
            "$archive" "$RUNNER_TEMP/blind-prior/extracted"
          SNIFF_BLIND_SEAL_PATH="$RUNNER_TEMP/blind-prior/extracted/blind-source-seal.json" \
            python tools/ci/temporal_prior_replay.py test blind
      - name: Replay research and synthetic prior identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          query="$(cat src/benchmark_assets/historical-v3-small-prior-identities.graphql)"
          gh api graphql -f "query=$query" > "$RUNNER_TEMP/small-prior-live.json"
          python tools/ci/temporal_prior_replay.py compare "$RUNNER_TEMP/small-prior-live.json" \
            sniffbench/historical-v3-small-prior-identities-response.json --data-only
          test "$(git rev-parse HEAD:gold_fixtures/repo)" = \
            ecb744731cbd00242f93a067632c390b0ddf344d
          python tools/ci/temporal_prior_replay.py test small

      - name: Authenticate and prepare the original frozen v2 frame
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/trysniff/sniff/actions/artifacts/9547888605 > "$RUNNER_TEMP/v2-artifact.json"
          gh api repos/trysniff/sniff/actions/runs/32804623556 > "$RUNNER_TEMP/v2-run.json"
          python tools/ci/prepare_temporal_prior_v2.py metadata \
            "$RUNNER_TEMP/v2-artifact.json" "$RUNNER_TEMP/v2-run.json"
          gh api repos/trysniff/sniff/actions/artifacts/9547888605/zip \
            | python tools/ci/prepare_temporal_prior_v2.py capture "$RUNNER_TEMP/v2-frame.zip"
          python tools/ci/prepare_temporal_prior_v2.py extract \
            "$RUNNER_TEMP/v2-frame.zip" "$RUNNER_TEMP/v2-frame"
          python tools/ci/prepare_temporal_prior_v2.py export "$GITHUB_WORKSPACE" "$RUNNER_TEMP/v2-source"

      - name: Verify the full frozen union and Parquet-backed temporal proof
        shell: bash
        run: |
          set -euo pipefail
          dataset="$RUNNER_TEMP/v2-dataset"
          python tools/ci/prepare_temporal_prior_v2.py download \
            "$RUNNER_TEMP/v2-source/sniffbench/historical-v2-protocol.json" "$dataset"
          export SNIFF_HISTORICAL_V2_FRAME_DIR="$RUNNER_TEMP/v2-frame"
          export SNIFF_HISTORICAL_V2_SOURCE_ROOT="$RUNNER_TEMP/v2-source"
          export SNIFF_HISTORICAL_V2_DATASET_ROOT="$dataset"
          python tools/ci/temporal_prior_replay.py test prior-union
          python tools/ci/temporal_prior_replay.py test prior-v2

  native-go-worlds:
    name: go-worlds-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The full Windows world census already runs for hours locally. This
    # dedicated bound does not borrow time from or truncate other proof suites.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-native-proof
        with:
          fixtures: go
      - name: Verify every normal Go compiler context without Git or model calls
        shell: bash
        run: |
          set -euo pipefail
          inventory="$(cargo test --lib --locked \
            semantic_indexer_runner::go_model::tests::normal_scan_discovers_every_go_context_without_git_or_model_calls \
            -- --exact --list --ignored)"
          test "$(printf '%s\n' "$inventory" | grep -c ': test$')" -eq 1
          printf '%s\n' "$inventory" | grep -Fx \
            'semantic_indexer_runner::go_model::tests::normal_scan_discovers_every_go_context_without_git_or_model_calls: test'
          cargo test --lib --locked \
            semantic_indexer_runner::go_model::tests::normal_scan_discovers_every_go_context_without_git_or_model_calls \
            -- --exact --ignored --test-threads=1 --nocapture

  msrv:
    name: msrv-1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --all-targets --locked

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify packaged execution contract matches the release artifact
        run: cmp src/benchmark_assets/historical-v2-execution-harness.json sniffbench/historical-v2-execution-harness.json
      - run: cargo package --locked --target-dir target/package-check
      - name: Keep benchmark data out except pinned v2 contracts
        run: |
          unexpected="$({ cargo package --locked --list | tr '\\' '/'; } \
            | grep '^sniffbench/' \
            | grep -Ev '^sniffbench/(README\.md|historical-v3-id-census-v2/(policy|artifact-contract)\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'sniffbench data must remain a repository or release artifact:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

  semantic-indexers:
    name: semantic-indexers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure the Rust toolchain for sandboxed Rust indexing
        run: rustup default stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
      - name: Install Linux indexer sandbox
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bubblewrap
      - name: Enable Linux user namespaces for indexer sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify Linux dependency-preparation network
        run: |
          bwrap --die-with-parent --unshare-all --share-net --clearenv \
            --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib \
            --ro-bind-try /lib64 /lib64 --ro-bind-try /etc /etc \
            --ro-bind /run /run \
            --proc /proc --dev /dev --tmpfs /tmp -- \
            /usr/bin/curl --fail --silent --show-error --head \
            https://plugins.gradle.org/m2/org/jetbrains/kotlin/jvm/org.jetbrains.kotlin.jvm.gradle.plugin/2.2.0/org.jetbrains.kotlin.jvm.gradle.plugin-2.2.0.pom
      - name: Require the compiler runtimes used by the pinned providers
        run: |
          node --version
          python3 --version
          go version
          java --version
          gradle --version
      - name: Install and run every pinned semantic indexer
        shell: bash
        run: |
          set -euo pipefail
          fixtures=(
            typescript
            javascript
            python
            go
            kotlin
            rust
          )
          for fixture in "${fixtures[@]}"; do
            cargo run --quiet -- indexers install "tests/semantic_gold_fixtures/${fixture}" --yes
            cargo run --quiet -- indexers index "tests/semantic_gold_fixtures/${fixture}" --yes
          done
          cargo test --lib --locked \
            benchmark::release::history_v3_semantic_census::tests::pinned_rust_provider_completes_v9_semantic_stage \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::history_v3_v2_offline_rehearsal_tests::replayed_v2_frame_reaches_review_with_pinned_rust_provider \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            semantic_indexer_installer::scip_typescript_patch::tests::patched_provider_emits_exact_public_overload_signatures \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::history_v2_semantic::tests::pinned_typescript_provider_drives_recursive_public_reexports \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::intentional_boundary_project_model_typescript::tests::real_pinned_compiler_api_emits_the_reference_world \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            semantic_indexer_runner::typescript_model::tests::normal_scan_ \
            -- --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::intentional_boundary_project_model_typescript::tests::real_pinned_compiler_api_emits_an_exact_loose_source_world \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::history_v2_node_consumer_profile::tests::real_typescript_and_node_resolvers_select_the_active_conditions \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::history_v2_node_consumer_profile::tests::real_resolvers_preserve_null_array_fallback_identity_without_executing_targets \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::history_v2_node_consumer_profile::tests::real_resolvers_apply_legacy_typings_and_main_precedence \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::history_v2_node_consumer_profile::tests::real_compiler_maps_generated_declarations_back_to_exact_source_identity \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            semantic_indexer_runner::typescript_runner::tests::live_project_reference_world_is_indexed_as_one_qualified_variant \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            semantic_indexer_runner::typescript_runner::tests::live_configured_and_loose_worlds_cover_every_exact_source \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::history_v2_semantic::tests::pinned_python_provider_drives_signatures_and_recursive_public_surfaces \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            semantic_indexer_runner::go_runner::tests::qualified_world_observer_rejects_substituted_runtime_image \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            semantic_indexer_runner::go_runner::tests::live_multi_shard_go_index_preserves_calls_and_structural_implementations \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
