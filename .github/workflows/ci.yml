name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  blind-prior-archive-preflight:
    name: blind-prior-archive-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify the released source-seal archive layout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download sniffbench-blind-oss-v1-source-seal --repo trysniff/sniff \
            --pattern sniffbench-blind-oss-v1-source-seal.zip --dir "$RUNNER_TEMP"
          archive="$RUNNER_TEMP/sniffbench-blind-oss-v1-source-seal.zip"
          echo "9cfca885c88ce7f8d2c7cc01114b6bc129acd5e2dfa432ef3b255858a51b65a9  $archive" \
            | sha256sum --check
          python3 tools/ci/extract_blind_source_seal.py "$archive" "$RUNNER_TEMP/extracted"

  test:
    name: test-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # macOS can spend roughly 53 minutes compiling and completing the library
    # suite before the cross-language dogfood fixtures run. Keep the whole
    # exhaustive matrix bounded without truncating those final proofs.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure the Rust toolchain for sandboxed Rust indexing
        run: rustup default stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
      - name: Install Linux proof sandbox
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bubblewrap
      - name: Enable Linux user namespaces for proof sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install pinned semantic indexers for dogfood
        shell: bash
        run: |
          set -euo pipefail
          for fixture in typescript javascript python go kotlin rust; do
            cargo run --quiet -- indexers install "tests/semantic_gold_fixtures/${fixture}" --yes
          done
      - name: Run tests
        if: runner.os != 'Windows'
        run: cargo test --all-targets --locked
      - name: Verify normal TypeScript compiler worlds in the native sandbox
        shell: bash
        run: |
          cargo test --lib --locked \
            semantic_indexer_runner::typescript_model::tests::normal_scan_ \
            -- --ignored --test-threads=1 --nocapture
      - name: Replay the pinned Scorecard publication witness
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          query="$(cat src/benchmark_assets/historical-v3-scorecard-publication.graphql)"
          gh api graphql -f "query=$query" | jq -S . > "$RUNNER_TEMP/scorecard-live.json"
          jq -S . sniffbench/historical-v3-scorecard-publication-response.json > "$RUNNER_TEMP/scorecard-pinned.json"
          cmp "$RUNNER_TEMP/scorecard-live.json" "$RUNNER_TEMP/scorecard-pinned.json"
          frame="$RUNNER_TEMP/scorecard-projects.csv"
          curl --fail --location --silent --show-error --retry 3 --output "$frame" \
            https://raw.githubusercontent.com/ossf/scorecard/40c1e35996730d4fdcbdb2e6a23917a2467e29b7/cron/internal/data/projects.csv
          echo "55b1de849d6d401bd6529a2806d587b53170cfbe7cdbc2ac5799ab65bf42807a  $frame" | sha256sum --check
          SNIFF_SCORECARD_FRAME_PATH="$frame" cargo test --lib --locked verifies_real_scorecard_publication_witness -- --ignored
      - name: Replay the blind prior repository identities
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          query="$(cat src/benchmark_assets/historical-v3-blind-prior-identities.graphql)"
          gh api graphql -f "query=$query" \
            | jq -e 'if has("errors") then error("GitHub GraphQL returned errors") else .data end' \
            | jq -S . > "$RUNNER_TEMP/blind-identities-live.json"
          jq -S . sniffbench/historical-v3-blind-prior-identities-response.json \
            > "$RUNNER_TEMP/blind-identities-pinned.json"
          cmp "$RUNNER_TEMP/blind-identities-live.json" "$RUNNER_TEMP/blind-identities-pinned.json"
          mkdir -p "$RUNNER_TEMP/blind-prior"
          gh release download sniffbench-blind-oss-v1-source-seal --repo trysniff/sniff \
            --pattern sniffbench-blind-oss-v1-source-seal.zip --dir "$RUNNER_TEMP/blind-prior"
          archive="$RUNNER_TEMP/blind-prior/sniffbench-blind-oss-v1-source-seal.zip"
          echo "9cfca885c88ce7f8d2c7cc01114b6bc129acd5e2dfa432ef3b255858a51b65a9  $archive" \
            | sha256sum --check
          mkdir -p "$RUNNER_TEMP/blind-prior/extracted"
          python3 tools/ci/extract_blind_source_seal.py \
            "$archive" "$RUNNER_TEMP/blind-prior/extracted"
          SNIFF_BLIND_SEAL_PATH="$RUNNER_TEMP/blind-prior/extracted/blind-source-seal.json" \
            cargo test --lib --locked verifies_real_blind_prior_temporal_proof -- --ignored
      - name: Replay research and synthetic prior identities
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          query="$(cat src/benchmark_assets/historical-v3-small-prior-identities.graphql)"
          gh api graphql -f "query=$query" \
            | jq -e 'if has("errors") then error("GitHub GraphQL returned errors") else .data end' \
            | jq -S . > "$RUNNER_TEMP/small-prior-live.json"
          jq -S . sniffbench/historical-v3-small-prior-identities-response.json \
            > "$RUNNER_TEMP/small-prior-pinned.json"
          cmp "$RUNNER_TEMP/small-prior-live.json" "$RUNNER_TEMP/small-prior-pinned.json"
          test "$(git rev-parse HEAD:gold_fixtures/repo)" = \
            ecb744731cbd00242f93a067632c390b0ddf344d
          cargo test --lib --locked benchmark::release::history_v3_small_prior_temporal::tests
      - name: Run Windows unit and non-dogfood integration tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --lib --bins --locked
          $tests = @(
            'callee_context',
            'durable_runtime',
            'file_verdicts_merge',
            'gold',
            'llm_impl',
            'preflight_cli',
            'ref_count_flags',
            'semantic_gold',
            'sniff_graph_regressions'
          )
          foreach ($test in $tests) {
            cargo test --test $test --locked -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run cross-language Windows dogfood
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SNIFF_DEBUG_INDEXERS = "1"
          $env:SNIFF_INTERNAL_INDEXER_TIMEOUT_SECS = "300"
          cargo test --test dogfood_suite brandset::default_scan_reviews_every_supported_language_end_to_end --locked -- --exact --test-threads=1 --nocapture

  msrv:
    name: msrv-1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --all-targets --locked

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify packaged execution contract matches the release artifact
        run: cmp src/benchmark_assets/historical-v2-execution-harness.json sniffbench/historical-v2-execution-harness.json
      - run: cargo package --locked --target-dir target/package-check
      - name: Keep benchmark data out except pinned v2 contracts
        run: |
          unexpected="$({ cargo package --locked --list | tr '\\' '/'; } \
            | grep '^sniffbench/' \
            | grep -Ev '^sniffbench/(README\.md|historical-v3-id-census-v2/(policy|artifact-contract)\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'sniffbench data must remain a repository or release artifact:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

  semantic-indexers:
    name: semantic-indexers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure the Rust toolchain for sandboxed Rust indexing
        run: rustup default stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
      - name: Install Linux indexer sandbox
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bubblewrap
      - name: Enable Linux user namespaces for indexer sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify Linux dependency-preparation network
        run: |
          bwrap --die-with-parent --unshare-all --share-net --clearenv \
            --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib \
            --ro-bind-try /lib64 /lib64 --ro-bind-try /etc /etc \
            --ro-bind /run /run \
            --proc /proc --dev /dev --tmpfs /tmp -- \
            /usr/bin/curl --fail --silent --show-error --head \
            https://plugins.gradle.org/m2/org/jetbrains/kotlin/jvm/org.jetbrains.kotlin.jvm.gradle.plugin/2.2.0/org.jetbrains.kotlin.jvm.gradle.plugin-2.2.0.pom
      - name: Require the compiler runtimes used by the pinned providers
        run: |
          node --version
          python3 --version
          go version
          java --version
          gradle --version
      - name: Install and run every pinned semantic indexer
        shell: bash
        run: |
          set -euo pipefail
          fixtures=(
            typescript
            javascript
            python
            go
            kotlin
            rust
          )
          for fixture in "${fixtures[@]}"; do
            cargo run --quiet -- indexers install "tests/semantic_gold_fixtures/${fixture}" --yes
            cargo run --quiet -- indexers index "tests/semantic_gold_fixtures/${fixture}" --yes
          done
          cargo test --lib --locked \
            benchmark::release::history_v3_semantic_census::tests::pinned_rust_provider_completes_v9_semantic_stage \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::history_v3_v2_offline_rehearsal_tests::replayed_v2_frame_reaches_review_with_pinned_rust_provider \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            semantic_indexer_installer::scip_typescript_patch::tests::patched_provider_emits_exact_public_overload_signatures \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::history_v2_semantic::tests::pinned_typescript_provider_drives_recursive_public_reexports \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::intentional_boundary_project_model_typescript::tests::real_pinned_compiler_api_emits_the_reference_world \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            semantic_indexer_runner::typescript_model::tests::normal_scan_ \
            -- --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::intentional_boundary_project_model_typescript::tests::real_pinned_compiler_api_emits_an_exact_loose_source_world \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::history_v2_node_consumer_profile::tests::real_typescript_and_node_resolvers_select_the_active_conditions \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::history_v2_node_consumer_profile::tests::real_resolvers_preserve_null_array_fallback_identity_without_executing_targets \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::history_v2_node_consumer_profile::tests::real_resolvers_apply_legacy_typings_and_main_precedence \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::history_v2_node_consumer_profile::tests::real_compiler_maps_generated_declarations_back_to_exact_source_identity \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            semantic_indexer_runner::typescript_runner::tests::live_project_reference_world_is_indexed_as_one_qualified_variant \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            semantic_indexer_runner::typescript_runner::tests::live_configured_and_loose_worlds_cover_every_exact_source \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::history_v2_semantic::tests::pinned_python_provider_drives_signatures_and_recursive_public_surfaces \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            semantic_indexer_runner::go_runner::tests::live_multi_shard_go_index_preserves_calls_and_structural_implementations \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            semantic_indexer_runner::go_runner::tests::live_empty_go_variant_is_recorded_without_a_scip_invocation \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            semantic_indexer_runner::go_runner::tests::live_nested_go_modules_and_tests_preserve_repository_paths \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            semantic_indexer_runner::go_runner::tests::live_standalone_go_source_uses_named_file_query_in_mixed_package_directory \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            benchmark::release::intentional_boundary_project_model_gradle::tests::real_gradle_tooling_model_commits_kotlin_publication_and_compilation_facts \
            -- --exact --ignored --test-threads=1 --nocapture

  historical-v2-command-recovery:
    name: historical-v2-command-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.15"
      - name: Prove historical-v2 transport rejects unsafe or drifting state
        run: python3 .github/scripts/test_historical_v2_assessment_transport.py
      - name: Prove long assessments retain status and signal semantics
        run: python3 .github/scripts/test_run_with_heartbeat.py
      - name: Prove forced-termination resume at the command boundary
        run: >-
          cargo test --locked --all-features
          --test historical_v2_command_recovery
          -- --exact
          killed_fixed_slot_command_resumes_without_crossing_the_stage_ceiling
          --test-threads=1

  verify:
    name: verify
    if: always()
    needs: [format, clippy, test, msrv, package, semantic-indexers, historical-v2-command-recovery]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        shell: bash
        run: |
          [[ "${{ needs.format.result }}" == "success" ]]
          [[ "${{ needs.clippy.result }}" == "success" ]]
          [[ "${{ needs.test.result }}" == "success" ]]
          [[ "${{ needs.msrv.result }}" == "success" ]]
          [[ "${{ needs.package.result }}" == "success" ]]
          [[ "${{ needs.semantic-indexers.result }}" == "success" ]]
          [[ "${{ needs.historical-v2-command-recovery.result }}" == "success" ]]
