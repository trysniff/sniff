name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # macOS regularly reaches 29+ minutes before the cross-language dogfood suite.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure the Rust toolchain for sandboxed Rust indexing
        run: rustup default stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
      - name: Install Linux proof sandbox
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bubblewrap
      - name: Enable Linux user namespaces for proof sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install pinned semantic indexers for dogfood
        shell: bash
        run: |
          set -euo pipefail
          for fixture in typescript javascript python go kotlin rust; do
            cargo run --quiet -- indexers install "tests/semantic_gold_fixtures/${fixture}" --yes
          done
      - name: Run tests
        if: runner.os != 'Windows'
        run: cargo test --all-targets --locked
      - name: Run Windows unit and non-dogfood integration tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --lib --bins --locked
          $tests = @(
            'callee_context',
            'file_verdicts_merge',
            'gold',
            'llm_impl',
            'preflight_cli',
            'ref_count_flags',
            'semantic_gold',
            'sniff_graph_regressions'
          )
          foreach ($test in $tests) {
            cargo test --test $test --locked -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run cross-language Windows dogfood
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SNIFF_DEBUG_INDEXERS = "1"
          $env:SNIFF_INTERNAL_INDEXER_TIMEOUT_SECS = "300"
          cargo test --test dogfood_suite brandset::default_scan_reviews_every_supported_language_end_to_end --locked -- --exact --test-threads=1 --nocapture

  msrv:
    name: msrv-1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --all-targets --locked

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify packaged execution contract matches the release artifact
        run: cmp src/benchmark_assets/historical-v2-execution-harness.json sniffbench/historical-v2-execution-harness.json
      - run: cargo package --locked --target-dir target/package-check
      - name: Keep benchmark data out of the installable crate
        run: |
          unexpected="$({ cargo package --locked --list | tr '\\' '/'; } \
            | grep '^sniffbench/' \
            | grep -v '^sniffbench/README.md$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'sniffbench data must remain a repository or release artifact:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

  semantic-indexers:
    name: semantic-indexers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure the Rust toolchain for sandboxed Rust indexing
        run: rustup default stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
      - name: Install Linux indexer sandbox
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bubblewrap
      - name: Enable Linux user namespaces for indexer sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify Linux dependency-preparation network
        run: |
          bwrap --die-with-parent --unshare-all --share-net --clearenv \
            --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib \
            --ro-bind-try /lib64 /lib64 --ro-bind-try /etc /etc \
            --ro-bind /run /run \
            --proc /proc --dev /dev --tmpfs /tmp -- \
            /usr/bin/curl --fail --silent --show-error --head \
            https://plugins.gradle.org/m2/org/jetbrains/kotlin/jvm/org.jetbrains.kotlin.jvm.gradle.plugin/2.2.0/org.jetbrains.kotlin.jvm.gradle.plugin-2.2.0.pom
      - name: Require the compiler runtimes used by the pinned providers
        run: |
          node --version
          python3 --version
          go version
          java --version
          gradle --version
      - name: Install and run every pinned semantic indexer
        shell: bash
        run: |
          set -euo pipefail
          fixtures=(
            typescript
            javascript
            python
            go
            kotlin
            rust
          )
          for fixture in "${fixtures[@]}"; do
            cargo run --quiet -- indexers install "tests/semantic_gold_fixtures/${fixture}" --yes
            cargo run --quiet -- indexers index "tests/semantic_gold_fixtures/${fixture}" --yes
          done
          cargo test --lib --locked \
            semantic_indexer_installer::scip_typescript_patch::tests::patched_provider_emits_exact_public_overload_signatures \
            -- --exact --ignored --test-threads=1 --nocapture
          cargo test --lib --locked \
            semantic_indexer_runner::go_runner::tests::live_multi_shard_go_index_preserves_calls_and_structural_implementations \
            -- --exact --ignored --test-threads=1 --nocapture

  historical-v2-command-recovery:
    name: historical-v2-command-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.15"
      - name: Prove historical-v2 transport rejects unsafe or drifting state
        run: python3 .github/scripts/test_historical_v2_assessment_transport.py
      - name: Prove long assessments retain status and signal semantics
        run: python3 .github/scripts/test_run_with_heartbeat.py
      - name: Prove forced-termination resume at the command boundary
        run: >-
          cargo test --locked --all-features
          --test historical_v2_command_recovery
          -- --exact
          killed_fixed_slot_command_resumes_without_crossing_the_stage_ceiling
          --test-threads=1

  verify:
    name: verify
    if: always()
    needs: [format, clippy, test, msrv, package, semantic-indexers, historical-v2-command-recovery]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        shell: bash
        run: |
          [[ "${{ needs.format.result }}" == "success" ]]
          [[ "${{ needs.clippy.result }}" == "success" ]]
          [[ "${{ needs.test.result }}" == "success" ]]
          [[ "${{ needs.msrv.result }}" == "success" ]]
          [[ "${{ needs.package.result }}" == "success" ]]
          [[ "${{ needs.semantic-indexers.result }}" == "success" ]]
          [[ "${{ needs.historical-v2-command-recovery.result }}" == "success" ]]
