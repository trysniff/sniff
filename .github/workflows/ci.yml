  historical-v2-command-recovery:
    name: historical-v2-command-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.15"
      - name: Prove historical-v2 transport rejects unsafe or drifting state
        run: python3 .github/scripts/test_historical_v2_assessment_transport.py
      - name: Prove long assessments retain status and signal semantics
        run: python3 .github/scripts/test_run_with_heartbeat.py
      - name: Prove forced-termination resume at the command boundary
        run: >-
          cargo test --locked --all-features
          --test historical_v2_command_recovery
          -- --exact
          killed_fixed_slot_command_resumes_without_crossing_the_stage_ceiling
          --test-threads=1

  verify:
    name: verify
    if: always()
    needs:
      - format
      - clippy
      - test
      - native-dogfood
      - native-compiler-proofs
      - native-go-worlds
      - native-library-proofs
      - temporal-prior-replay
      - msrv
      - package
      - semantic-indexers
      - historical-v2-command-recovery
      - blind-prior-archive-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        shell: bash
        run: |
          [[ "${{ needs.format.result }}" == "success" ]]
          [[ "${{ needs.clippy.result }}" == "success" ]]
          [[ "${{ needs.test.result }}" == "success" ]]
          [[ "${{ needs.native-dogfood.result }}" == "success" ]]
          [[ "${{ needs.native-compiler-proofs.result }}" == "success" ]]
          [[ "${{ needs.native-go-worlds.result }}" == "success" ]]
          [[ "${{ needs.native-library-proofs.result }}" == "success" ]]
          [[ "${{ needs.temporal-prior-replay.result }}" == "success" ]]
          [[ "${{ needs.msrv.result }}" == "success" ]]
          [[ "${{ needs.package.result }}" == "success" ]]
          [[ "${{ needs.semantic-indexers.result }}" == "success" ]]
          [[ "${{ needs.historical-v2-command-recovery.result }}" == "success" ]]
          [[ "${{ needs.blind-prior-archive-preflight.result }}" == "success" ]]
