name: Set up native compiler proofs
description: Configure real toolchains and install the pinned semantic providers.
inputs:
  fixtures:
    description: Space-separated pinned language fixtures to install.
    default: typescript javascript python go kotlin rust
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - name: Configure Rust for sandboxed indexing
      shell: bash
      run: rustup default stable
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"
    - uses: actions/setup-go@v6
      with:
        go-version: "1.25"
        cache: false
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.12.5"
        enable-cache: false
    - uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: "8.8"
    - name: Install Linux proof sandbox
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bubblewrap
    - name: Enable Linux proof sandbox user namespaces
      if: runner.os == 'Linux'
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Install pinned semantic indexers
      shell: bash
      env:
        INDEXER_FIXTURES: ${{ inputs.fixtures }}
      run: |
        set -euo pipefail
        read -r -a fixtures <<< "$INDEXER_FIXTURES"
        test "${#fixtures[@]}" -gt 0
        for fixture in "${fixtures[@]}"; do
          case "$fixture" in
            typescript|javascript|python|go|kotlin|rust) ;;
            *) echo "Unassigned native fixture: $fixture" >&2; exit 1 ;;
          esac
          cargo run --locked --quiet -- indexers install "tests/semantic_gold_fixtures/${fixture}" --yes
        done
