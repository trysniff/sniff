query {
  node(id: "HRFPE_lADOEgpjzc71xS6ZzwAAAAbIjjfd") {
    ... on HeadRefForcePushedEvent {
      id
      createdAt
      afterCommit { oid }
      pullRequest {
        number
        repository { nameWithOwner }
      }
    }
  }
  repository(owner: "ossf", name: "scorecard") {
    object(expression: "61aa2b50d672f3da8e52bfd5dd9f1b77532a7752:cron/internal/data/projects.csv") {
      oid
    }
  }
}
